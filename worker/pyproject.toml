[project]
name = "pandabase-worker"
version = "0.0.0"
description = "PandaBase media worker: claims jobs from the State Engine and runs local Ollama VLM inference."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.86.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pandabase_worker"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src:tests"
explicit_package_bases = true
exclude = ['^\.venv/']

[tool.pytest]
testpaths = ["tests"]
