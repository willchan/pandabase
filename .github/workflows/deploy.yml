name: Deploy

# Production deploy after CI passes on main (PLAN M9, DESIGN §8 *Continuous deployment*):
#   migrate (Turso prod) → deploy-web (vercel deploy --prod) → publish-worker (GHCR :<sha>, :main)
#                                                            → smoke (read-only checks; reports only)
# The Mac Mini pulls the worker itself (scripts/deploy/mac-update.sh): an image tagged with a sha
# exists only if every step above succeeded for that sha, which is its "green" signal.
# Vercel's own production auto-deploy is off (web/vercel.json), so code never ships before its
# migration; migrations are backward-compatible (CLAUDE.md), so a failed web deploy after a
# successful migration leaves production working.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One deploy at a time, in order; a newer sha waiting replaces an older waiting one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  migrate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      # Before anything changes: every secret this workflow needs (migrate and deploy-web), so an
      # unconfigured environment fails here with their names instead of half-deploying.
      - name: Production environment is configured
        run: >-
          scripts/deploy/require-env.sh production
          TURSO_DATABASE_URL TURSO_AUTH_TOKEN VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate Turso production
        run: pnpm db:migrate:prod
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - name: Deploy telemetry
        if: always()
        run: scripts/deploy/emit-deploy.sh migrate "$SHA" "${{ job.status }}"
        env:
          PANDABASE_API_URL: ${{ vars.PANDABASE_API_URL }}
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}

  deploy-web:
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PANDABASE_API_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: vercel deploy --prod
        # Remote build on Vercel with the project's settings (root directory `web`) and its
        # production env vars. The token is only ever passed to the CLI, never printed.
        run: |
          npx --yes vercel@65.0.0 deploy --prod --yes --token="$VERCEL_TOKEN" \
            --meta githubCommitSha="$SHA" >"$RUNNER_TEMP/vercel-url"
          echo "Deployed: $(cat "$RUNNER_TEMP/vercel-url")"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy telemetry
        if: always()
        run: scripts/deploy/emit-deploy.sh web "$SHA" "${{ job.status }}"
        env:
          PANDABASE_API_URL: ${{ vars.PANDABASE_API_URL }}
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}

  publish-worker:
    needs: deploy-web
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      # The Mac Mini is Apple Silicon: the image is linux/arm64 (emulated build).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: worker
          platforms: linux/arm64
          push: true
          build-args: GIT_SHA=${{ env.SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          tags: |
            ghcr.io/willchan/pandabase-worker:${{ env.SHA }}
            ghcr.io/willchan/pandabase-worker:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy telemetry
        if: always()
        run: scripts/deploy/emit-deploy.sh worker_image "$SHA" "${{ job.status }}"
        env:
          PANDABASE_API_URL: ${{ vars.PANDABASE_API_URL }}
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}

  smoke:
    # Read-only production smoke (docs/TESTING.md *Post-deploy smoke*): GETs plus one
    # unauthenticated POST that must be refused (scripts/deploy/web_smoke.py enforces it), and a
    # SELECT on Turso's migration journal. A failure fails this job and posts once to Discord; it
    # never rolls back (Vercel's Instant Rollback is a human's call: docs/SETUP-CLOUD.md). It runs
    # beside publish-worker, so a red smoke doesn't hold back the Mac Mini's worker.
    needs: deploy-web
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - name: Production URL is configured
        run: scripts/deploy/require-env.sh production PANDABASE_API_URL TURSO_DATABASE_URL TURSO_AUTH_TOKEN
        env:
          PANDABASE_API_URL: ${{ vars.PANDABASE_API_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations applied in Turso production (read-only)
        # Exit 1 on a mismatch; web_smoke.py reads the JSON and fails the check.
        continue-on-error: true
        run: pnpm -s db:migrations-status >"$RUNNER_TEMP/migrations.json"
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - name: Smoke ${{ vars.PANDABASE_API_URL }}
        id: smoke
        run: python3 scripts/deploy/web_smoke.py --base-url "$PANDABASE_API_URL" --migrations "$RUNNER_TEMP/migrations.json"
        env:
          PANDABASE_API_URL: ${{ vars.PANDABASE_API_URL }}
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
      - name: Tell Discord
        if: failure()
        # Optional secret; the URL goes to curl on stdin, never on the command line.
        run: |
          if [ -z "$DEPLOY_DISCORD_WEBHOOK_URL" ]; then
            echo "::notice::DEPLOY_DISCORD_WEBHOOK_URL not set in production; not posted"
            exit 0
          fi
          msg="❌ PandaBase production smoke failed for \`${SHA:0:7}\`: ${FAILED:-see the run}. $RUN_URL — roll back from Vercel → Deployments → previous Production → Instant Rollback if the site is broken (docs/SETUP-CLOUD.md)."
          printf 'url = "%s"\n' "$DEPLOY_DISCORD_WEBHOOK_URL" |
            curl -fsS --max-time 15 -K - -H 'Content-Type: application/json' \
              --data-binary "$(jq -cn --arg m "$msg" '{content: $m, allowed_mentions: {parse: []}}')" \
              >/dev/null || echo "::warning::Discord webhook post failed"
        env:
          DEPLOY_DISCORD_WEBHOOK_URL: ${{ secrets.DEPLOY_DISCORD_WEBHOOK_URL }}
          FAILED: ${{ steps.smoke.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Deploy telemetry
        if: always()
        run: scripts/deploy/emit-deploy.sh web-smoke "$SHA" "${{ job.status }}" "$FAILED"
        env:
          PANDABASE_API_URL: ${{ vars.PANDABASE_API_URL }}
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          FAILED: ${{ steps.smoke.outputs.failed }}
