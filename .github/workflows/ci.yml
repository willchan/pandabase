name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: the `contract-migration` label changes the migrations check's verdict.
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations are consistent and match the schema
        run: |
          pnpm drizzle-kit check
          pnpm db:generate
          if [ -n "$(git status --porcelain -- db/migrations)" ]; then
            git status --porcelain -- db/migrations
            echo "::error::Schema changed without a migration — run pnpm db:generate and commit it."
            exit 1
          fi
      - name: Reset and seed a local database
        run: pnpm db:reset && pnpm db:seed
      - run: pnpm --filter web build

  e2e:
    # Playwright against `next dev` with DEV_AUTH_BYPASS and a freshly seeded db/e2e.db (PLAN M5).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  contracts:
    # Zod contracts → openapi.json → Pydantic models must be committed and up to date.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.3"
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:gen
      - name: Generated contracts are up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated contracts are stale — run pnpm contracts:gen and commit."
            exit 1
          fi

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [worker, agent/tools]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.3"
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy .
      - run: uv run pytest

  worker-image:
    # The worker's Docker image (python slim + ffmpeg, non-root) builds from ./worker through the
    # local-build override (PLAN M8/M9); deploy.yml builds and pushes the same Dockerfile to GHCR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.build.yml build

  ops:
    # Mac Mini ops (PLAN M8/M9): shellcheck, actionlint, compose files, plists, deploy-script tests
    # (bats), the backward-compatible-migration check, make dry runs, smoke helpers' ruff/mypy.
    runs-on: ubuntu-latest
    env:
      MIGRATIONS_BASE: origin/${{ github.base_ref || 'main' }}
      CONTRACT_MIGRATION_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'contract-migration') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the migrations check diffs against the base branch
      - name: Install bats, xmllint and actionlint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats libxml2-utils shellcheck
          GOBIN="$HOME/.local/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.3"
          enable-cache: true
          cache-dependency-glob: |
            worker/uv.lock
            agent/tools/uv.lock
      - run: (cd worker && uv sync --locked) && (cd agent/tools && uv sync --locked)
      - run: make ops-check

  launchd:
    # plutil is macOS-only; the ops job checks the plists with xmllint + plistlib on Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: plutil -lint ops/launchd/*.plist
