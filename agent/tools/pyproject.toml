[project]
name = "pandabase-tools"
version = "0.0.0"
description = "PandaBase agent tools: deterministic Python invoked by OpenClaw (cart injection, receipt parsing, API client)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pandabase_tools"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
explicit_package_bases = true
exclude = ['^\.venv/']

[tool.pytest]
testpaths = ["tests"]
